server.port=8080


# ==========================================================
# H2 DATABASE
# ==========================================================

# File-based H2 database.
# Data will be stored locally and will survive application restarts.
spring.datasource.url=jdbc:h2:file:./data/supportsphere;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver


# ==========================================================
# JPA / HIBERNATE
# ==========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


# ==========================================================
# H2 CONSOLE
# ==========================================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# ==========================================================
# JWT
# ==========================================================

# Base64 secret.
# Default value is for local development only.
jwt.secret=${JWT_SECRET:U3VwcG9ydFNwaGVyZURldk9ubHlTZWNyZXRLZXlDaGFuZ2VNZUluUHJvZHVjdGlvbjEyMzQ1Njc4OTA=}

# Token lifetime = 24 hours
jwt.expiration=${JWT_EXPIRATION:86400000}


# ==========================================================
# CORS
# ==========================================================

# Angular application
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}


# ==========================================================
# AUTO-EVALUATION
# ==========================================================

# Set to true only when evaluation requires public
# GET /api/ticket and GET /api/feedback endpoints.
app.security.public-read-endpoints=${PUBLIC_READ_ENDPOINTS:false}


# ==========================================================
# ERROR HANDLING
# ==========================================================

# Never expose stack traces to the browser.
server.error.include-stacktrace=never

# ==========================================================
# LOGGING
# ==========================================================
logging.level.com.examly.springapp=INFO


# ==========================================================
# AI FAQ CHATBOT - PHASE 2
# ==========================================================

# Set GEMINI_API_KEY in your environment to enable
# semantic search and Gemini-generated answers.
#
# If no API key is configured, the chatbot automatically
# uses lexical word-overlap matching.

gemini.api.key=${GEMINI_API_KEY:}

gemini.embedding.model=gemini-embedding-2

gemini.generation.model=gemini-2.5-flash

chatbot.similarity.threshold=0.65

chatbot.lexical.threshold=0.08